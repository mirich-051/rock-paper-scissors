<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Rock Paper Scissors</title>
  <script src="rps.js" defer></script>
  <style>
    html {
      width: 100%;
      height: inherit;
      font-family: Arial, Helvetica, sans-serif;
      font-size: 16px;
    }

    body {
      margin: 0;
      text-align: center;
      background-color: #dddddd;
    }

    h1 {
      color: navy;
      margin: 3rem auto;
    }

    button {
      width: 7rem;
      height: 2rem;
      padding: 0.5rem auto;
      font-size: 1rem;
      background-color: navy;
      color: white;
      font-weight: bold;
      border-radius: 2rem;
      border: 2px solid navy;
      margin: 1.5rem 2rem;
    }

    button:active {
      background-color: lightblue;
      /*border: 2px solid navy;*/
    }

    div {
      font-size: 2rem;
      color: navy;
    }

    p.win {
      color: green;
      font-weight: bold;
    }

    p.lose {
      color: red;
      font-weight: bold;
    }
  </style>
</head>

<body>
  <h1>Rock Paper Scissors</h1>
  <button id="btnRock">Rock</button>
  <button id="btnPaper">Paper</button>
  <button id="btnScissors">Scissors</button>
  <div></div>
</body>

</html>
